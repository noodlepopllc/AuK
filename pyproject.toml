[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auk"
version = "0.1.0"
description = "AuK: An Open-Source Foundational Model for Speech Generation and Editing"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Keep the PyTorch family on the tested 2.7 ABI line. Users may preinstall a
    # platform-specific CPU/CUDA build before installing AuK.
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
    "qwen-omni-utils>=0.0.9",
    "omegaconf>=2.3.0",
    "torchdiffeq",
    "x_transformers>=1.31.14",
    "safetensors",
    "accelerate>=0.33.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["auk*"]

[tool.setuptools.package-data]
"auk.infer" = ["pe.config.yaml"]
"auk.model.vae.modules.commons" = ["assets/*.npz"]

[tool.ruff]
extend-exclude = ["src/auk/model/vae/"]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# Only ignore variables with names starting with "_".
dummy-variable-rgx = "^_.*$"

[tool.ruff.lint.per-file-ignores]
"src/auk/model/vae/**" = ["E741", "F841", "F821", "F401", "F403", "F405"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
